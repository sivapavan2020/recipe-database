# Rebuilds mealsDB.json from the seed + (optional) Edamam pull, validating every
# recipe through the clinical gate, then commits the result. Runs weekly + on demand.
name: Update recipe database

on:
  schedule:
    - cron: '0 6 * * 1'      # every Monday 06:00 UTC
  workflow_dispatch: {}       # manual "Run workflow" button
  push:
    paths:
      - 'sources/**'          # rebuild when the seed source changes
      - 'updater.js'
      - 'verifyMacros.js'

permissions:
  contents: write            # let the workflow token push the rebuilt mealsDB.json (fixes 403 on git push)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Node 18+ has global fetch (needed for Edamam); 22 avoids the Node-20 deprecation

      - name: Build & validate mealsDB.json
        env:
          # OPTIONAL — set these under Settings ▸ Secrets and variables ▸ Actions.
          # If unset, updater.js publishes the seed only (no API pull).
          EDAMAM_APP_ID: ${{ secrets.EDAMAM_APP_ID }}
          EDAMAM_APP_KEY: ${{ secrets.EDAMAM_APP_KEY }}
          # NOTE: do NOT wire EDAMAM_ACCOUNT_USER — free-plan Recipe Search apps 401 if that header is sent.
          VALIDATION_PROFILE: global   # or 'cardio' for strict AHA/NIH-DASH caps
        run: node updater.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain mealsDB.json)" ]]; then
            git add mealsDB.json
            git commit -m "chore: rebuild mealsDB.json ($(date -u +%Y-%m-%d))"
            if git push; then
              echo "✓ Pushed updated mealsDB.json"
            else
              echo "::error::git push failed (403?). Set Settings ▸ Actions ▸ General ▸ Workflow permissions → Read and write."
              exit 1
            fi
          else
            echo "No change to mealsDB.json"
          fi
