name: Update Recipe Database

on:
  schedule:
    - cron: '0 0 * * 0'      # every Sunday at midnight UTC
  workflow_dispatch: {}      # <-- lets YOU press a button to test it

permissions:
  contents: write

jobs:
  update-meals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run the updater
        run: node updater.js

      - name: Commit the updated file
        run: |
          git config user.name  "recipe-bot"
          git config user.email "recipe-bot@users.noreply.github.com"
          git add mealsDB.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly recipe update"
            git push
          fi
